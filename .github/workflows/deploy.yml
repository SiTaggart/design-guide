name: Deploy

on:
  workflow_run:
    workflows: ["Checks"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip when this commit is no longer main HEAD
        id: guard
        run: |
          set -euo pipefail
          head_sha="${{ github.event.workflow_run.head_sha }}"
          head_sha="${head_sha,,}"
          current="$(git ls-remote origin refs/heads/main | awk 'NR==1 { print $1 }')"
          current="${current,,}"
          if [[ ! "${current}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Could not read origin refs/heads/main." >&2
            exit 1
          fi
          if [[ "${current}" == "${head_sha}" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "Skipped: ${head_sha} is no longer main HEAD (${current}); the newer run deploys" >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.stale != 'true'
        with:
          bun-version-file: package.json
      - name: Install dependencies
        if: steps.guard.outputs.stale != 'true'
        run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        if: steps.guard.outputs.stale != 'true'
        run: bunx wrangler d1 migrations apply PAGE_QUEUE --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        id: deploy
        if: steps.guard.outputs.stale != 'true'
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/wrangler-deploy.log"
          bunx wrangler deploy 2>&1 | tee "$log"
          version_id="$(
            sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$log" \
              | grep -oE 'Current Version ID:[[:space:]]*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' \
              | awk 'END { print $NF }' \
              || true
          )"
          if [[ ! "${version_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "No Worker version id found in wrangler deploy output." >&2
            exit 1
          fi
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Write deployment summary
        if: steps.guard.outputs.stale != 'true'
        run: |
          set -euo pipefail
          version_id="${{ steps.deploy.outputs.version_id }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if [[ ! "${version_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "No Worker version id found." >&2
            exit 1
          fi
          {
            echo "### Deployed design-guide"
            echo ""
            echo "- Worker version id: \`${version_id}\`"
            echo "- Git SHA: \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
